apply plugin: 'maven-publish'

group = 'com.github.hallow-inc'
version = '0.9'

def repo = 'hallow-inc/sign-in-with-apple-button-android'

android {
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId this.group
            artifactId 'signin-with-apple'
            version this.version

            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/$repo"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
